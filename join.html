<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     <!--nav bar-->
    <div class="grid grid-cols-3  p-5  bg-slate-800 h-30 w-full gap-20">
        <!--system logo and banner-->
        <div class="flex flex-row justify-center items-center">
       <img src="logo.png" alt="" class="h-20 w-20 rounded-xl">
       <h1 class="text-white text-5xl font-bold animate-pulse">Coop<span class="text-blue-600">Save</span></h1>
        </div>
        <!--nav links-->
        <div class="flex flex-row items-center justify-around gap-10 ">
     <a href="home.html" class="text-white text-2xl font-bold hover:border-b-2 border-blue-500">Home</a>
      <a href="about.html" class="text-white text-2xl font-bold hover:border-b-2 border-blue-500">About</a>
       <a href="contact.html" class="text-white text-2xl font-bold hover:border-b-2 border-blue-500">Contact</a>
        <a href="#" class="text-white text-2xl font-bold hover:border-b-2 border-blue-500">Savings</a>
         
        </div>
        <!--register links-->
        <div class="flex flex-row items-center gap-10 ml-20 ">
            <a href="join.html" class="text-white text-2xl font-bold "><button class="hover:scale-120 hover:transition duration-2000 bg-gradient-to-r from-blue-500 to-purple-900 h-10 w-30 rounded-xl hover:cursor-pointer">Join Us</button></a>
            <a href="#" class="text-white text-2xl font-bold "><button class="hover:scale-120 hover:transition duration-2000 bg-gradient-to-r from-blue-500 to-purple-900 h-10 w-30 rounded-xl hover:cursor-pointer">Admin</button></a>
        </div>
    </div>
    <!--end of nav bar-->
    <!--main content-->
    <div class="bg-[url('join_bg.jpg')] h-200 w-full p-5 grid grid-cols-2 items-center">
        <div class="border-2 border-slate-500 h-170 w-150 "></div>
































        <div class="flex flex-col items-center p-5  h-170 w-100 rounded-xl shadow-2xl border-2 border-slate-500">
            <h1 class="text-2xl font-bold text-white my-10">Register Here To Join Our Team</h1>
            <div class="w-full">
                <h1 class="text-white font-bold ml-35">Fullname</h1>
                <input type="text" name="fullname" id=""  class="border-2 border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold " placeholder="Enter your fullname">

                 <div class="w-full">
                <h1 class="text-white font-bold ml-35">Email</h1>
                <input type="email" name="email" id=""  class="border-2 border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold" placeholder="Enter your email">
            </div>
             <div class="w-full">
                <h1 class="text-white font-bold ml-35">Phone</h1>
                <input type="tel" name="phone" id=""  class="border-2 border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold" placeholder="Enter your phone number">
            </div>
             <div class="w-full">
                <h1 class="text-white font-bold ml-35">Location</h1>
                <input type="text" name="location" id=""  class="border-2 border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold" placeholder="Enter your location">
            </div>
             <div class="w-full">
                <h1 class="text-white font-bold ml-35">Title</h1>
                <input type="text" name="title" id=""  class="border-2 border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold" placeholder="Enter your title">
            </div>
             <div class="w-full">
                <h1 class="text-white font-bold ml-35">Description</h1>
                <textarea name="description" id=""  class="border-2 border-slate-500 h-30 w-full rounded-xl text-white pl-3 font-bold" placeholder="Write your description here"></textarea>
            </div>
             <input type="submit" name="submit" id="" value="Register "  class="border-2 my-5 bg-blue-900 cursor-pointer border-slate-500 h-10 w-full rounded-xl text-white pl-3 font-bold">
        </div>
    </div>
</body>
</html>
